[package]
name = "pika"
version = "0.1.0"
edition = "2021"
description = "PikaSync sync daemon + CLI — keeps .pikasync/ files in sync with the cloud"

[[bin]]
name = "pika"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = "1"
anyhow = "1"
walkdir = "2"
dirs = "5"
